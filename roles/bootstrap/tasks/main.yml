---
# =============================================================================
#  bootstrap — runs with raw module before Python3 exists on the target.
#  gather_facts must be false in the play that calls this role.
# =============================================================================

- name: Wait for cloud-init to finish (if present)
  ansible.builtin.raw: |
    test -f /usr/bin/cloud-init && cloud-init status --wait || true
  changed_when: false

- name: Kill stale apt/dpkg locks from fresh boot
  ansible.builtin.raw: |
    systemctl stop unattended-upgrades 2>/dev/null || true
    systemctl stop apt-daily.service 2>/dev/null || true
    systemctl stop apt-daily-upgrade.service 2>/dev/null || true
    rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
          /var/cache/apt/archives/lock /var/lib/apt/lists/lock
    dpkg --configure -a 2>/dev/null || true
  changed_when: false

- name: Update apt cache (raw)
  ansible.builtin.raw: apt-get update -qq
  changed_when: false

- name: Install Python3 + sudo (raw — no Python available yet)
  ansible.builtin.raw: |
    DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
      python3 python3-pip python3-apt sudo
  changed_when: false

- name: Gather facts now that Python3 is present
  ansible.builtin.setup:

- name: Confirm Python version
  ansible.builtin.debug:
    msg: "Python {{ ansible_python.version.major }}.{{ ansible_python.version.minor }} ready on {{ inventory_hostname }}"
