---
- name: Install MySQL prerequisites
  ansible.builtin.apt:
    name: [curl, gnupg2, lsb-release, apt-transport-https, ca-certificates, python3-pymysql]
    state: present
    update_cache: yes

- name: Download MySQL APT config package
  ansible.builtin.get_url:
    url: https://dev.mysql.com/get/mysql-apt-config_0.8.33-1_all.deb
    dest: /tmp/mysql-apt-config.deb
    mode: "0644"
    timeout: 120

- name: Install MySQL APT config package
  ansible.builtin.apt:
    deb: /tmp/mysql-apt-config.deb
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Update apt cache after adding MySQL repo
  ansible.builtin.apt:
    update_cache: yes

- name: Install MySQL 8.0 server and client
  ansible.builtin.apt:
    name: [mysql-server, mysql-client]
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable and start MySQL
  ansible.builtin.systemd:
    name: mysql
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for MySQL to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ mysql_port }}"
    timeout: 60

- name: Set MySQL root password with native auth plugin
  ansible.builtin.shell: |
    mysql -u root -e "
      ALTER USER 'root'@'localhost'
        IDENTIFIED WITH mysql_native_password BY '{{ mysql_root_password }}';
      FLUSH PRIVILEGES;
    " 2>/dev/null || \
    mysql -u root -p'{{ mysql_root_password }}' -e "SELECT 1;" 2>/dev/null
  changed_when: false
  no_log: true

- name: Write root credentials to /root/.my.cnf
  ansible.builtin.copy:
    dest: /root/.my.cnf
    mode: "0600"
    owner: root
    content: |
      [client]
      user=root
      password={{ mysql_root_password }}
  no_log: true

- name: Remove anonymous MySQL users
  ansible.builtin.shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
      DELETE FROM mysql.user WHERE User=''; FLUSH PRIVILEGES;"
  changed_when: false
  no_log: true

- name: Remove MySQL test database
  ansible.builtin.shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
      DROP DATABASE IF EXISTS test;
      DELETE FROM mysql.db WHERE Db='test' OR Db='test\\_%';
      FLUSH PRIVILEGES;"
  changed_when: false
  no_log: true

- name: Create Zabbix MySQL database
  ansible.builtin.shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
      CREATE DATABASE IF NOT EXISTS {{ zabbix_db_name }}
        CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;"
  changed_when: false
  no_log: true

- name: Create Zabbix MySQL user and grant privileges
  ansible.builtin.shell: |
    mysql -u root -p'{{ mysql_root_password }}' -e "
      CREATE USER IF NOT EXISTS '{{ zabbix_db_user }}'@'localhost'
        IDENTIFIED WITH mysql_native_password BY '{{ zabbix_db_password }}';
      GRANT ALL PRIVILEGES ON {{ zabbix_db_name }}.* TO '{{ zabbix_db_user }}'@'localhost';
      FLUSH PRIVILEGES;"
  changed_when: false
  no_log: true

- name: Deploy MySQL tuning config for Zabbix workloads
  ansible.builtin.template:
    src: mysql_zabbix.cnf.j2
    dest: /etc/mysql/conf.d/zabbix_tuning.cnf
    mode: "0644"
  notify: Restart mysql
