---
# =============================================================================
#  group_vars/grafana.yml — Grafana
#
#  NO IP ADDRESSES HERE. Datasource URLs are built automatically from
#  the inventory so they always point to the right VMs regardless of
#  which IPs you chose.
# =============================================================================

# ── Version ───────────────────────────────────────────────────────────────────
grafana_version: "12.4.1"

# ── Grafana settings ──────────────────────────────────────────────────────────
grafana_user:           grafana
grafana_group:          grafana
grafana_port:           3000
grafana_admin_user:     admin
grafana_admin_password: "PUTPASSWD_HERE"
grafana_allow_sign_up:  "false"

grafana_data_dir:       /var/lib/grafana
grafana_logs_dir:       /var/log/grafana
grafana_plugins_dir:    /var/lib/grafana/plugins
grafana_dashboards_dir: /var/lib/grafana/dashboards

# ── Datasources — URLs built from inventory IPs automatically ─────────────────
# These point to your Prometheus and Zabbix VMs using the IPs you set
# in inventory/hosts.yml. You never need to edit this section.
grafana_datasources:
  - name:      Prometheus
    type:      prometheus
    access:    proxy
    url:       "http://{{ hostvars[groups['prometheus'][0]]['ansible_host'] }}:{{ prometheus_port }}"
    isDefault: true
    jsonData:
      scrapeInterval: "15s"
      httpMethod: POST

  - name:   Zabbix
    type:   alexanderzobnin-zabbix-datasource
    access: proxy
    url:    "http://{{ hostvars[groups['zabbix'][0]]['ansible_host'] }}:{{ zabbix_web_port }}/api_jsonrpc.php"
    jsonData:
      username: "{{ zabbix_api_user }}"
      trends:    true
      trendsFrom: "7d"
      trendsRange: "4d"
    secureJsonData:
      password: "{{ zabbix_api_password }}"

# ── Plugins ───────────────────────────────────────────────────────────────────
grafana_plugins:
  - alexanderzobnin-zabbix-app
  - grafana-clock-panel
  - grafana-piechart-panel

# ── Grafana domain — set to the grafana-vm IP from inventory ─────────────────
grafana_domain: "{{ hostvars[groups['grafana'][0]]['ansible_host'] }}"
