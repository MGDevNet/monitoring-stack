---
# =============================================================================
#  inventory/hosts.yml
#
#  ╔══════════════════════════════════════════════════════════════════════╗
#  ║  THIS IS THE ONLY FILE YOU NEED TO EDIT FOR A NEW DEPLOYMENT        ║
#  ║  Change the IPs below to any free addresses in your subnet.         ║
#  ║  Everything else in the project reads from these values.            ║
#  ╚══════════════════════════════════════════════════════════════════════╝
#
#  How to use:
#    1. Set your subnet in internal_network below
#    2. Pick a free IP for each VM and set ansible_host
#    3. Set your SSH user in ansible_user
#    4. Run: ansible-playbook playbooks/site.yml
# =============================================================================

all:
  vars:
    # ── SSH settings ──────────────────────────────────────────────────────────
    ansible_user:                ubuntu           # SSH user on target machines
    ansible_ssh_private_key_file: ~/.ssh/id_rsa   # Path to your SSH private key
    ansible_python_interpreter:  /usr/bin/python3

    # ── Your network ──────────────────────────────────────────────────────────
    internal_network: "192.168.1.0/24"   # ← Set to your LAN subnet

  children:

    # ── Prometheus VM ─────────────────────────────────────────────────────────
    prometheus:
      hosts:
        prometheus-vm:
          ansible_host: 192.168.1.10     # ← Pick any free IP in your subnet
          ct_id:        200              #   Proxmox container/VM ID
          ct_hostname:  prometheus

    # ── Grafana VM ────────────────────────────────────────────────────────────
    grafana:
      hosts:
        grafana-vm:
          ansible_host: 192.168.1.11     # ← Pick any free IP in your subnet
          ct_id:        201
          ct_hostname:  grafana

    # ── Zabbix VM (server + frontend + MySQL) ─────────────────────────────────
    zabbix:
      hosts:
        zabbix-vm:
          ansible_host: 192.168.1.12     # ← Pick any free IP in your subnet
          ct_id:        202
          ct_hostname:  zabbix

    # ── Additional servers you want to monitor ────────────────────────────────
    # Add as many as you need. Agents (node_exporter + zabbix_agent2)
    # will be deployed to all hosts in this group automatically.
    app_servers:
      hosts:
        app-server-01:
          ansible_host: 192.168.1.20     # ← Your server IP
        # app-server-02:
        #   ansible_host: 192.168.1.21
        # app-server-03:
        #   ansible_host: 192.168.1.22

    # ── Monitored group — receives agents (do not edit this section) ──────────
    monitored:
      children:
        prometheus:
        grafana:
        zabbix:
        app_servers:
